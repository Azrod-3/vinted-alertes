name: Veille Vinted

on:
  schedule:
    # GitHub abandonne purement et simplement une partie des déclenchements
    # planifies quand ses serveurs sont charges : observe ici, 56 min sans un
    # seul demarrage avec ce cron. On ne compte donc pas sur sa ponctualite —
    # chaque job couvre 25 min tout seul (voir bouclerSecondes), et le cron
    # court sert surtout a en relancer un des que le precedent se termine.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permet de lancer un test à la main

# nécessaire pour que le job puisse enregistrer les annonces déjà signalées
permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      # Les images GitHub embarquent deja Google Chrome : le telecharger a
      # chaque job etait inutile, et un telechargement bloque emporte tout le
      # passage (observe : 29 min sur une etape qui en prend 32 s). On ne
      # l'installe donc qu'en dernier recours, avec une limite de temps.
      - name: Chrome
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "Chrome absent de l'image, installation."
            npx playwright install chrome --with-deps
          fi

      - name: Chercher les bonnes affaires
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: npm run scan

      - name: Mémoriser les annonces déjà signalées
        run: |
          # On ne demande pas à git de fusionner ce JSON : il n'y arrive pas et
          # l'étape échouait, ce qui faisait perdre l'état et réalerter tout.
          # On repart de la version du dépôt et on y verse la nôtre.
          cp etat.json "$RUNNER_TEMP/etat-local.json"
          git config user.name "veille-vinted"
          git config user.email "actions@github.com"

          for essai in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node fusionner-etat.mjs "$RUNNER_TEMP/etat-local.json" etat.json
            git add etat.json
            if git diff --cached --quiet; then
              echo "rien de nouveau à enregistrer"
              exit 0
            fi
            git commit -q -m "veille : mise à jour de l'état"
            if git push -q origin HEAD:main; then
              echo "état enregistré (essai $essai)"
              exit 0
            fi
            echo "poussée refusée, le dépôt a bougé — nouvelle tentative"
          done
          echo "::warning::état non enregistré après 3 essais"
